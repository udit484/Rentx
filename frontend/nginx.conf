server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /health {
        default_type text/plain;
        return 200 'rentx-frontend: healthy\n';
    }

    location /api/owner/products {
        proxy_pass http://product-service:5003;
    }
    location /api/owner/bookings {
        proxy_pass http://booking-service:5004;
    }
    location /api/products {
        proxy_pass http://product-service:5003;
    }
    location /api/wishlist {
        proxy_pass http://product-service:5003;
    }
    location /api/bookings {
        proxy_pass http://booking-service:5004;
    }
    location /api/users {
        proxy_pass http://user-service:5002;
    }
    location /api/payments {
        proxy_pass http://payment-service:5005;
    }
    location /api/notifications {
        proxy_pass http://notification-service:5006;
    }
    location /api/auth {
        proxy_pass http://auth-service:5001;
    }

    location /api/ {
        return 404 '{"message":"API route not found"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
